name: Alpaca Trading Bot

on:
  schedule:
    # GitHub Actions free-tier silently drops :00 schedules under load.
    # Using off-hour minutes (7,22,37,52) is meaningfully more reliable, and
    # multiple cron entries give GitHub more chances to actually fire one.
    # 14:00–20:00 UTC = 10am–4pm ET (DST); bot exits immediately if market closed.
    - cron: "7,22,37,52 14,15,16,17,18,19,20 * * 1-5"
    - cron: "12,42 13,14,15,16,17,18,19,20 * * 1-5"

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit state files back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading bot
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:   ${{ secrets.ALPACA_BASE_URL }}
        run: python bot.py

      - name: Save state files back to repo
        run: |
          git config user.name  "Alpaca Trading Bot"
          git config user.email "bot@alpaca-challenge"
          git add strategy.json performance.json trade_log.json heartbeat.json
          git diff --staged --quiet || git commit -m "bot: state update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
