name: Alpaca Trading Bot

# Public repo = unlimited GitHub Actions minutes, so we run a single long-lived
# job that loops the bot every ~25 min through market hours. Cron just needs
# to fire ONCE per day to start the loop. Multiple cron entries below give
# us many chances to catch the start-of-day fire.

on:
  schedule:
    # Pre-market starters — try to start the daily loop near market open.
    # 13:30, 13:40, 13:50 UTC = 9:30, 9:40, 9:50 ET (market open is 9:30 ET DST).
    # 14:00, 14:15, 14:30 UTC are additional fallbacks if all the early ones miss.
    - cron: "30,40,50 13 * * 1-5"
    - cron: "0,15,30,45 14 * * 1-5"
    - cron: "0,30 15,16,17,18,19 * * 1-5"

  # Manual trigger
  workflow_dispatch:

  # External / API trigger
  repository_dispatch:
    types: [run-bot]

# Only one loop running at a time — if cron fires while another loop is active,
# the new run queues. The active loop's market_is_open check at the top of each
# iteration will make the next loop exit fast if the day is already done.
concurrency:
  group: trading-bot-loop
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # ~5.8 hours, just under the 6-hour job limit
    permissions:
      contents: write
    env:
      ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BASE_URL:   ${{ secrets.ALPACA_BASE_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git for state-file commits
        run: |
          git config user.name  "Alpaca Trading Bot"
          git config user.email "bot@alpaca-challenge"

      - name: Loop bot every 25 min until market closes
        run: |
          # 13 iterations × 25 min ≈ 5.4 hours — covers the full 9:30-16:00 ET
          # window with margin. Each iteration: pull, run bot, commit, push, sleep.
          for i in $(seq 1 13); do
            echo "::group::Iteration $i ($(date -u +%H:%M:%S) UTC)"

            # Pull any state changes from other branches/dispatch runs (rare,
            # but we want a clean working tree before committing).
            git pull --rebase --autostash origin main || true

            python bot.py || echo "bot.py exited non-zero — continuing the loop"

            git add strategy.json performance.json trade_log.json heartbeat.json
            if ! git diff --staged --quiet; then
              git commit -m "bot: state update $(date -u '+%Y-%m-%d %H:%M UTC')"
              git push || git pull --rebase origin main && git push
            fi

            # Stop the loop early if the market has closed in the meantime.
            # Use bot.py's own market_is_open() to stay consistent with how the
            # bot decides whether to act. If the check itself errors, default
            # to "keep looping" — never let a bad check kill the daily run.
            CLOSED=$(python -c "import bot; print('1' if not bot.market_is_open() else '0')" 2>/dev/null || echo "0")
            if [ "$CLOSED" = "1" ] && [ "$i" -gt 2 ]; then
              echo "Market closed — ending daily loop after iteration $i."
              break
            fi

            echo "::endgroup::"
            if [ "$i" -lt 13 ]; then sleep 1500; fi   # 25 min
          done
