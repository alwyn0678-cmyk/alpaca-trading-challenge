name: Daily Trash Talk Email

on:
  schedule:
    # 20:30 UTC = 4:30 PM ET (UTC-4 DST) — fires Monday–Friday right after market close
    - cron: "30 20 * * 1-5"

  # Trigger manually from the GitHub Actions tab to test any time
  workflow_dispatch:

jobs:
  trash-talk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fire the trash talk email
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python trash_talk.py
